# SlabVault Anchor workspace — devnet-only SVF programs.
# Tensor Foundation programs use MAINNET IDs in lib/onchain/program-ids.ts (Phase 1).

[features]
seeds = false
skip-lint = false

[programs.localnet]
slabvault_broker = "SVFB111111111111111111111111111111111111111"

[programs.devnet]
slabvault_broker = "SVFB111111111111111111111111111111111111111"

# Mainnet: do not deploy slabvault_broker until audit — placeholder only.
[programs.mainnet]
slabvault_broker = "SVFB111111111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[workspace]
members = ["slabvault-broker"]
